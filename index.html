<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miguel Liao | Senior PHP & Laravel Developer</title>
    <meta name="description" content="Curriculum Vitae y Portafolio de Miguel Liao - Especialista en PHP/Laravel, Arquitectura de Software e Integraciones.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#fffbe6',
                100: '#fff3b3',
                400: '#fbbf24',
                500: '#f59e0b',
                600: '#d97706',
              },
              darkbg: '#0f172a',
              darkcard: '#1e293b',
              darkborder: '#334155',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['"Plus Jakarta Sans"', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      h1, h2, h3, h4, .font-display {
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      
      @media print {
        @page {
          size: A4 portrait;
          margin: 8mm 12mm;
        }
        
        html, body {
          background: white !important;
          color: #0f172a !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          font-size: 11px;
        }

        #root {
          width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
        }

        .print-hidden {
          display: none !important;
        }

        main {
          box-shadow: none !important;
          border-radius: 0 !important;
          width: 100% !important;
          max-width: 100% !important;
          margin: 0 !important;
          border: none !important;
          background: white !important;
          color: #0f172a !important;
        }

        /* Force dark elements to render cleanly for print */
        header {
          background-color: #0f172a !important;
          color: white !important;
          padding: 1.5rem !important;
          border-radius: 0.5rem !important;
        }

        h1 { font-size: 22pt !important; }
        h2 { font-size: 14pt !important; }
        h3 { font-size: 13pt !important; }
        p, li, span { font-size: 9.5pt !important; line-height: 1.35 !important; }

        .page-break-inside-avoid {
          page-break-inside: avoid;
        }

        .flex-col.md\:flex-row {
          flex-direction: row !important;
        }
        .w-full.md\:w-2\/3 { width: 65% !important; }
        .w-full.md\:w-1\/3 { width: 35% !important; }
      }
    </style>
    <script type="module" src="/index.tsx"></script>
</head>
<body class="bg-slate-900 text-slate-100 antialiased min-h-screen selection:bg-amber-500 selection:text-slate-900 transition-colors duration-300">
    <div id="root"></div>
</body>
</html>
